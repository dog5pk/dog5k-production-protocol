name: Deploy DPP website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "whitepaper/**"
      - "tools/build_whitepaper_pdf.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build publication PDF
        run: |
          python -m pip install --disable-pip-version-check reportlab
          python tools/build_whitepaper_pdf.py whitepaper/DPP-Whitepaper-v1.0.md site/DPP-Whitepaper-v1.0.pdf
          test -s site/DPP-Whitepaper-v1.0.pdf

      - name: Configure and initialize Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
